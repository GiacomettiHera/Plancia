<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#131417">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Plancia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link id="icofont" rel="stylesheet">
<style>
:root{--acc:oklch(0.78 0.15 65);--acc-d:oklch(0.55 0.13 55);--bg:#131417;--key:#1f2024;--ink:#e8e6e3;--mute:#8d8a83;--ok:oklch(0.78 0.16 150);--bad:oklch(0.64 0.19 25);--bad-d:oklch(0.46 0.15 25);--track:#2f3036}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;padding:max(14px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
.screen.on{display:flex}
.mono{font-family:'IBM Plex Mono',monospace}
#connect{flex-direction:column;justify-content:center;align-items:flex-start;gap:18px;max-width:560px;margin:0 auto}
#connect h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
#connect p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.btn{appearance:none;border:0;border-radius:14px;padding:16px 26px;font:700 16px Manrope,sans-serif;background:var(--acc);color:#1a1206;box-shadow:inset 0 -4px 0 var(--acc-d)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--acc-d)}
.btn[disabled]{opacity:.5}
#err{color:oklch(0.75 0.15 25);font-size:13px;min-height:1em}
#deck{flex-direction:column;gap:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--mute);height:20px;white-space:nowrap}
.bar>div{overflow:hidden;text-overflow:ellipsis}
#pg{color:var(--ink);font-weight:600;letter-spacing:.04em}
#pg.back::before{content:'‹ ';color:var(--acc)}
#tms{color:var(--acc);margin-right:14px}
#tms.bad{color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px}
.dot.off{background:oklch(0.7 0.15 25)}
#grid{flex:1;display:grid;gap:12px;min-height:0}
.k{position:relative;overflow:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0;min-width:0;background:var(--key);box-shadow:inset 0 -4px 0 #0b0b0d,inset 0 1px 0 #2e2f35;transition:background .12s,box-shadow .12s,transform .06s,opacity .12s;touch-action:none}
.k.press{transform:translateY(2px);box-shadow:inset 0 -1px 0 #0b0b0d}
.k.on{background:var(--acc);color:#1a1206;box-shadow:inset 0 -4px 0 var(--acc-d),0 0 24px oklch(0.78 0.15 65 / .35)}
.k.bad{background:var(--bad);color:#fff;box-shadow:inset 0 -4px 0 var(--bad-d)}
.k.col{background:var(--kc);box-shadow:inset 0 -4px 0 rgb(0 0 0 / .35)}
.k.col.lt{color:#1a1206}
.k.col.on{background:var(--kc);box-shadow:inset 0 0 0 3px var(--ink),0 0 24px rgb(255 255 255 / .2)}
.k.dim{opacity:.4}
.k.empty{background:transparent;box-shadow:none;border:1.5px dashed #2a2b30}
.k.lg::after{content:'';position:absolute;right:10px;bottom:10px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.k.on.lg::after,.k.col.lg::after{background:currentColor;opacity:.6}
.g{font-weight:800;line-height:1;font-size:clamp(18px,6vmin,30px);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.g.sm{font-size:clamp(13px,4vmin,20px);letter-spacing:.04em}
.k.desk .g{font-family:Manrope,sans-serif;font-size:clamp(30px,11vmin,48px);letter-spacing:-.02em}
.ico{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:clamp(26px,9vmin,40px);line-height:1;letter-spacing:normal;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;overflow:hidden;max-width:90%}
.l{font-size:12px;font-weight:600;opacity:.6;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%}
.k.on .l,.k.bad .l,.k.col .l{opacity:.85}
/* slider */
.k.sl{padding:14px 16px;gap:10px;align-items:stretch}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.sl .l{max-width:none;opacity:.8}
.sl .val{font-size:13px;font-weight:600;color:var(--acc)}
.trk{position:relative;background:var(--track);border-radius:10px;overflow:hidden}
.fil{position:absolute;left:0;bottom:0;background:var(--acc);border-radius:10px}
.sl.h{justify-content:center}
.sl.h .trk{height:16px}
.sl.h .fil{top:0}
.sl.v{align-items:center}
.sl.v .top{flex-direction:column;align-items:center;order:2;gap:2px}
.sl.v .trk{width:16px;flex:1;order:1}
.sl.v .fil{right:0}
.sl.mu .fil{background:var(--mute)}
.sl.mu .val{color:var(--mute)}
.sl.na{opacity:.4}
/* in riproduzione */
.k.now{container-type:size;padding:12px}
.now .in{display:flex;align-items:center;gap:14px;width:100%;height:100%}
.now .art{height:100%;aspect-ratio:1;max-width:50%;border-radius:10px;background:#2a2b30 center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mute)}
.now .art.has .g{display:none}
.now .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.now .ti{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .ar{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .stt{font-size:11px;color:var(--acc);letter-spacing:.06em}
@container (max-aspect-ratio: 5/4){.now .in{justify-content:center}.now .art{max-width:100%}.now .meta{display:none}}
#lost{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2a1f10;color:var(--acc);border:1px solid #4a3515;padding:6px 12px;border-radius:999px;font-size:12px;display:none}
</style>
</head>
<body>

<section id="connect" class="screen on">
  <div class="mono" style="font-size:12px;letter-spacing:.12em;color:var(--acc)">PLANCIA</div>
  <h1>Collega il PC via Bluetooth</h1>
  <p id="hint">Avvia Plancia sul PC, poi tocca Collega e scegli il PC dall'elenco. La prima volta Android chiede di associare i dispositivi.</p>
  <button id="go" class="btn">Collega</button>
  <div id="err"></div>
</section>

<section id="deck" class="screen">
  <div class="bar mono">
    <div><span id="dot" class="dot"></span><span id="pcname">PC</span></div>
    <div id="pg"></div>
    <div><span id="tms"></span><span id="deskinfo"></span></div>
  </div>
  <div id="grid"></div>
  <div id="lost" class="mono">Riconnessione…</div>
</section>

<script>
// Protocollo: vedi windows/Plancia/BleServer.cs e TrayApp.cs
const U = n => `7a1e000${n}-5c3b-4c1e-9f1a-2b7d9c3e4f10`;
const SVC = U(0), CMD = U(1), STATE = U(2), LAYOUT = U(3), INFO = U(4), ART = U(5);
const CHUNK = 480; // come BleServer.Chunk
const HOLD_MS = 450;
const GLYPH = {
  'media.prev': '|◀︎', 'media.next': '▶︎|', 'media.now': '♪',
  'vol.mute': 'MUTO', 'vol.down': '−', 'vol.up': '+', deskNext: '→', deskPrev: '←',
  'mic.mute': 'MIC', 'audio.output': 'OUT', 'teams.mute': 'MIC', 'teams.video': 'CAM',
  'teams.hand': 'MANO', 'teams.blur': 'BLUR', 'teams.leave': 'ESCI',
  launch: 'APRI', hotkey: 'KEY', macro: 'MACRO', 'window.focus': 'APP', 'window.toDesk': '⇥',
  page: '▸', 'page.back': '↩'
};
const REACT = { like: '👍', love: '❤️', applause: '👏', wow: '😮', laugh: '😂' };
const $ = id => document.getElementById(id);
const dec = new TextDecoder(), enc = new TextEncoder();

let device, ch = {}, layout = null, info = {}, st = null, artVer = -1, artUrl = null;
let page = 0, stack = [], views = [], wake, retry = 0, connecting = false;

// ---- Coda GATT: una operazione alla volta, i comandi passano davanti alle letture lunghe ----
const hi = [], lo = [];
let busy = false;
function op(fn, prio) {
  return new Promise((res, rej) => { (prio ? hi : lo).push({ fn, res, rej }); pump(); });
}
async function pump() {
  if (busy) return;
  busy = true;
  while (hi.length || lo.length) {
    const t = (hi.length ? hi : lo).shift();
    try { t.res(await t.fn()); } catch (e) { t.rej(e); }
  }
  busy = false;
}
const pend = {};
function resetQueue() {
  for (const t of hi.splice(0).concat(lo.splice(0))) t.rej(new Error('disconnesso'));
  for (const k in pend) delete pend[k];
}

function write(obj, withResponse) {
  const data = enc.encode(JSON.stringify(obj)), c = ch.cmd;
  if (withResponse) return c.writeValueWithResponse ? c.writeValueWithResponse(data) : c.writeValue(data);
  return c.writeValueWithoutResponse ? c.writeValueWithoutResponse(data) : c.writeValue(data);
}
function send(obj) { if (ch.cmd) op(() => write(obj), true).catch(() => {}); }
// Per gli slider: se un invio è già in coda si aggiorna solo il valore da mandare.
function sendLatest(key, obj) {
  if (!ch.cmd) return;
  const queued = key in pend;
  pend[key] = obj;
  if (queued) return;
  op(() => { const o = pend[key]; delete pend[key]; return write(o); }, true).catch(() => {});
}

// Valori lunghi a blocchi: {"o":[id,offset]} su COMMAND, poi lettura.
async function readBig(c, id) {
  const parts = [];
  let off = 0;
  for (let n = 0; n < 400; n++) {
    const b = await op(async () => {
      await write({ o: [id, off] }, true);
      const dv = await c.readValue();
      return new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength).slice();
    });
    parts.push(b);
    off += b.length;
    if (b.length < CHUNK) break;
  }
  const all = new Uint8Array(off);
  let p = 0;
  for (const b of parts) { all.set(b, p); p += b.length; }
  return all;
}
const json = bytes => JSON.parse(dec.decode(bytes));

// [0] desktop  [1] n. desktop  [2] ver. layout  [3] Teams  [4] media  [5] volume  [6] muto  [7] flag  [8] ver. info  [9..] slider app
function parseState(dv) {
  const b = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  return {
    d: b[0], c: b[1], v: b[2], tm: b[3], m: b[4], vol: b[5] === 255 ? -1 : b[5], mu: b[6] === 1, f: b[7], iv: b[8],
    apps: Array.from(b.slice(9), x => x === 255 ? -1 : x)
  };
}
const inMeeting = () => !!(st && st.f & 16);

// ---- Schermate ----
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function err(m) { $('err').textContent = m || ''; }

if (!navigator.bluetooth) {
  $('go').disabled = true;
  $('hint').textContent = !isSecureContext
    ? 'Questa pagina deve essere aperta da un indirizzo https:// per usare il Bluetooth.'
    : 'Il browser non supporta Web Bluetooth. Usa Chrome per Android.';
}

$('go').addEventListener('click', async () => {
  err('');
  try {
    const d = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    await connect(d);
  } catch (e) { if (e.name !== 'NotFoundError') err(e.message); }
});

// ---- Connessione ----
async function connect(d) {
  if (connecting) return;
  connecting = true;
  try {
    device = d;
    device.removeEventListener('gattserverdisconnected', onLost);
    device.addEventListener('gattserverdisconnected', onLost);
    resetQueue();
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    const [cmd, state, lay, inf, art] = await Promise.all([CMD, STATE, LAYOUT, INFO, ART].map(u => svc.getCharacteristic(u)));
    ch = { cmd, state, layout: lay, info: inf, art };
    await loadLayout();
    state.removeEventListener('characteristicvaluechanged', onState);
    state.addEventListener('characteristicvaluechanged', onState);
    await op(() => state.startNotifications());
    st = null;
    onStateBytes(await op(() => state.readValue()));
    retry = 0;
    $('lost').style.display = 'none';
    $('dot').classList.remove('off');
    show('deck');
    keepAwake();
  } finally { connecting = false; }
}

async function loadLayout() {
  const l = json(await readBig(ch.layout, 3));
  if (!Array.isArray(l.pages)) throw new Error('Versione di Plancia sul PC non compatibile: aggiornala.');
  // Stesso ordine di AppConfig.AppSliders(): al massimo 11 slider di app.
  let s = 0;
  for (const p of l.pages) for (const k of p.keys) if (k.a === 'app.slider') k._s = s < 11 ? s++ : -1;
  layout = l;
  if (page >= l.pages.length) { page = 0; stack = []; }
  stack = stack.filter(p => p < l.pages.length);
  $('pcname').textContent = (l.name || 'PC').toUpperCase();
  loadIcons();
  render();
}

async function loadInfo() {
  info = json(await readBig(ch.info, 4));
  const needArt = layout?.pages.some(p => p.keys.some(k => k.a === 'media.now'));
  if (needArt && info.art !== artVer) {
    const bytes = await readBig(ch.art, 5);
    artVer = info.art;
    if (artUrl) URL.revokeObjectURL(artUrl);
    artUrl = bytes.length ? URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })) : null;
  }
  update();
}

// Ricarica layout/info quando cambia la loro versione nello stato. Una sola sincronizzazione alla volta.
const want = { layout: false, info: false };
let syncing = false;
async function sync() {
  if (syncing) return;
  syncing = true;
  try {
    while (want.layout || want.info) {
      if (want.layout) { want.layout = false; await loadLayout(); want.info = true; }
      if (want.info) { want.info = false; await loadInfo(); }
    }
  } catch { } finally { syncing = false; }
}

function onState(e) { onStateBytes(e.target.value); }
function onStateBytes(dv) {
  const s = parseState(dv), prev = st;
  st = s;
  if (prev && s.v !== prev.v) want.layout = true;
  if (!prev || s.iv !== prev.iv) want.info = true;
  if (want.layout || want.info) sync();
  update();
}

function onLost() {
  resetQueue();
  if (!device) return;
  $('dot').classList.add('off');
  $('lost').style.display = 'block';
  if (retry > 8) { show('connect'); err('Connessione persa. Tocca Collega.'); retry = 0; return; }
  const wait = Math.min(8000, 500 * 2 ** retry++);
  setTimeout(() => { if (!device.gatt.connected) connect(device).catch(onLost); }, wait);
}

async function keepAwake() {
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && device?.gatt.connected) keepAwake(); });

function goFull() {
  if (document.fullscreenElement || matchMedia('(display-mode: fullscreen)').matches) return;
  document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
}

// Icone Material Symbols: si scaricano solo quelle usate nel layout.
function loadIcons() {
  const names = new Set();
  for (const p of layout.pages) for (const k of p.keys) if (k.i && /^[a-z0-9_]+$/.test(k.i)) names.add(k.i);
  const href = names.size
    ? 'https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0,0&icon_names=' + [...names].sort().join(',') + '&display=block'
    : '';
  if ($('icofont').getAttribute('href') !== href) $('icofont').setAttribute('href', href);
}

// ---- Pagine ----
function goPage(p) {
  if (!layout || p === page || p < 0 || p >= layout.pages.length) return;
  stack.push(page);
  page = p;
  render();
}
function goBack() {
  page = stack.length ? stack.pop() : 0;
  render();
}
$('pg').addEventListener('click', () => { if (stack.length) goBack(); });

// ---- Griglia ----
function render() {
  if (!layout) return;
  const P = layout.pages[page], C = layout.cols, R = layout.rows, n = C * R;
  const portrait = innerHeight > innerWidth, g = $('grid');
  // In verticale la griglia viene trasposta: colonne e righe si scambiano.
  g.style.gridTemplateColumns = `repeat(${portrait ? R : C},1fr)`;
  g.style.gridTemplateRows = `repeat(${portrait ? C : R},1fr)`;
  g.innerHTML = '';
  views = [];
  const covered = new Set();
  for (let i = 0; i < n; i++) {
    if (covered.has(i)) continue;
    const k = P.keys[i] || { a: 'none' }, w = k.w || 1, h = k.h || 1, c = i % C, r = Math.floor(i / C);
    for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) if (dx || dy) covered.add(i + dy * C + dx);
    const v = makeKey(k, i);
    v.el.style.gridColumn = portrait ? `${r + 1} / span ${h}` : `${c + 1} / span ${w}`;
    v.el.style.gridRow = portrait ? `${c + 1} / span ${w}` : `${r + 1} / span ${h}`;
    g.appendChild(v.el);
    views.push(v);
  }
  const pg = $('pg');
  pg.textContent = layout.pages.length > 1 ? (P.n || '').toUpperCase() : '';
  pg.classList.toggle('back', stack.length > 0);
  update();
}
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(render, 120); });

function update() {
  if (!layout || !st) return;
  for (const v of views) v.upd();
  const names = info.ds || [];
  const dk = layout.pages.flatMap(p => p.keys).find(k => k.a === 'desk' && k.n === st.d && k.l);
  const dn = dk ? dk.l : names[st.d - 1];
  $('deskinfo').textContent = `DESKTOP ${st.d}/${st.c}` + (dn ? ' · ' + dn.toUpperCase() : '');
  const t = $('tms');
  t.textContent = inMeeting() ? (st.tm === 2 ? 'TEAMS MUTO' : st.tm === 1 ? 'TEAMS MIC ON' : 'TEAMS') : '';
  t.classList.toggle('bad', st.tm === 2);
}

function isLight(hex) {
  let m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return false;
  let h = m[1];
  if (h.length === 3) h = h.replace(/./g, x => x + x);
  const n = parseInt(h, 16);
  return 0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255) > 160;
}

function makeKey(k, i) {
  const el = document.createElement('div');
  el.className = 'k';
  if (k.a === 'none') { el.classList.add('empty'); return { el, upd() {} }; }
  if (k.c) {
    el.classList.add('col');
    el.style.setProperty('--kc', k.c);
    if (isLight(k.c)) el.classList.add('lt');
  }
  if (k.a === 'vol.slider' || k.a === 'app.slider') return makeSlider(k, el);
  if (k.a === 'media.now') return makeNow(k, i, el);

  if (k.lg) el.classList.add('lg');
  if (k.a === 'desk') el.classList.add('desk');
  const glyph = document.createElement(k.i ? 'span' : 'div');
  if (k.i) { glyph.className = 'ico'; glyph.textContent = k.i; }
  else {
    const t = k.a === 'desk' ? String(k.n || '') : k.a === 'teams.react' ? (REACT[k.r] || REACT.like) : k.a === 'media.playpause' ? '▶︎' : (GLYPH[k.a] || '•');
    glyph.className = 'g' + (t.length > 3 ? ' sm' : '');
    glyph.textContent = t;
  }
  const label = document.createElement('div');
  label.className = 'l';
  el.append(glyph, label);
  bindPress(el, k, i);

  const fixed = k.l || (k.a === 'page' ? layout.pages[k.p]?.n : k.a === 'hotkey' ? '' : k.a === 'window.focus' ? k.app : '') || '';
  const set = (cls, on) => el.classList.toggle(cls, !!on);
  return {
    el, upd() {
      const f = st.f, meet = inMeeting();
      let l = fixed;
      switch (k.a) {
        case 'desk':
          set('on', st.d === k.n);
          if (!l) l = (info.ds || [])[k.n - 1] || '';
          break;
        case 'media.playpause':
          if (!k.i) glyph.textContent = st.m === 1 ? '❚❚' : '▶︎';
          break;
        case 'vol.mute': set('on', st.mu); break;
        case 'mic.mute':
          set('bad', f & 1);
          if (!l) l = f & 1 ? 'Muto' : 'Microfono';
          break;
        case 'audio.output': if (!l) l = info.o || ''; break;
        case 'teams.mute':
          set('dim', st.tm === 0);
          set('on', st.tm === 1);
          set('bad', st.tm === 2);
          if (!l || st.tm === 3) l = ['Teams non attivo', 'Microfono attivo', 'Muto', 'Tocca per associare'][st.tm] || 'Teams';
          break;
        case 'teams.video': set('dim', !meet); set('on', meet && f & 2); break;
        case 'teams.hand': set('dim', !meet); set('on', meet && f & 4); break;
        case 'teams.blur': set('dim', !meet); set('on', meet && f & 8); break;
        case 'teams.leave': case 'teams.react': set('dim', !meet); break;
      }
      if (label.textContent !== l) label.textContent = l;
    }
  };
}

// Tocco breve subito; con pressione lunga configurata si decide al rilascio.
function bindPress(el, k, i) {
  let timer = 0, done = true;
  el.addEventListener('pointerdown', () => {
    goFull();
    el.classList.add('press');
    navigator.vibrate?.(12);
    if (!k.lg) { fire(k, i, false); setTimeout(() => el.classList.remove('press'), 120); return; }
    done = false;
    timer = setTimeout(() => {
      done = true;
      el.classList.remove('press');
      navigator.vibrate?.([20, 40, 20]);
      fire(k.lg, i, true);
    }, HOLD_MS);
  });
  const end = cancel => () => {
    if (!k.lg || done) return;
    clearTimeout(timer);
    done = true;
    el.classList.remove('press');
    if (!cancel) fire(k, i, false);
  };
  el.addEventListener('pointerup', end(false));
  el.addEventListener('pointercancel', end(true));
  el.addEventListener('pointerleave', end(true));
}

function fire(def, i, isLong) {
  if (def.a === 'page') return goPage(def.p || 0);
  if (def.a === 'page.back') return goBack();
  send({ k: isLong ? [page, i, 1] : [page, i] });
}

function makeSlider(k, el) {
  el.classList.add('sl');
  el.innerHTML = '<div class="top"><span class="l"></span><span class="val mono"></span></div><div class="trk"><div class="fil"></div></div>';
  const [top, trk] = el.children, lab = top.firstChild, val = top.lastChild, fil = trk.firstChild;
  const isVol = k.a === 'vol.slider';
  lab.textContent = k.l || (isVol ? 'Volume' : k.app || 'App');
  let local = -1, holdUntil = 0, dragging = false;
  const remote = () => isVol ? st.vol : k._s >= 0 ? (st.apps[k._s] ?? -1) : -1;
  const horiz = () => el.clientWidth >= el.clientHeight * 0.9;
  const draw = v => {
    const h = horiz();
    el.classList.toggle('h', h);
    el.classList.toggle('v', !h);
    el.classList.toggle('na', v < 0);
    el.classList.toggle('mu', isVol && st.mu);
    val.textContent = v < 0 ? (isVol ? '—' : 'non attiva') : v + '%';
    const p = Math.max(0, v) + '%';
    fil.style.width = h ? p : '';
    fil.style.height = h ? '' : p;
  };
  const at = e => {
    const r = trk.getBoundingClientRect();
    const x = horiz() ? (e.clientX - r.left) / r.width : (r.bottom - e.clientY) / r.height;
    return Math.round(Math.min(1, Math.max(0, x)) * 100);
  };
  const move = e => {
    local = at(e);
    draw(local);
    sendLatest(isVol ? 'vol' : 'app' + k._s, isVol ? { v: local } : { av: [k._s, local] });
  };
  el.addEventListener('pointerdown', e => {
    if (!st || remote() < 0) return;
    goFull();
    dragging = true;
    el.setPointerCapture(e.pointerId);
    navigator.vibrate?.(8);
    move(e);
  });
  el.addEventListener('pointermove', e => { if (dragging) move(e); });
  const stop = () => { if (!dragging) return; dragging = false; holdUntil = Date.now() + 1200; };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  // Durante il trascinamento (e poco dopo) si ignora il valore del PC, che arriva in ritardo.
  return { el, upd() { draw(dragging || Date.now() < holdUntil ? local : remote()); } };
}

function makeNow(k, i, el) {
  el.classList.add('now');
  el.innerHTML = '<div class="in"><div class="art"><div class="g">♪</div></div><div class="meta"><div class="ti"></div><div class="ar"></div><div class="stt mono"></div></div></div>';
  const art = el.querySelector('.art'), ti = el.querySelector('.ti'), ar = el.querySelector('.ar'), stt = el.querySelector('.stt');
  bindPress(el, k, i);
  let shown = null;
  return {
    el, upd() {
      if (shown !== artUrl) {
        shown = artUrl;
        art.style.backgroundImage = artUrl ? `url(${artUrl})` : '';
        art.classList.toggle('has', !!artUrl);
      }
      ti.textContent = st.m ? (info.t || 'Senza titolo') : (k.l || 'Nessun media');
      ar.textContent = st.m ? (info.ar || '') : '';
      stt.textContent = st.m === 1 ? '▶︎ IN RIPRODUZIONE' : st.m === 2 ? '❚❚ IN PAUSA' : '';
    }
  };
}

// Riconnessione automatica a un PC già autorizzato (se il browser lo consente).
(async () => {
  if (!navigator.bluetooth?.getDevices) return;
  try {
    const [d] = await navigator.bluetooth.getDevices();
    if (!d) return;
    $('hint').textContent = 'Riconnessione a un PC già associato…';
    await connect(d);
  } catch { $('hint').textContent = "Avvia Plancia sul PC, poi tocca Collega e scegli il PC dall'elenco."; }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
