<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Plancia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --accent-foreground: oklch(0.205 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --radius: 0.625rem;
  --ok: oklch(0.72 0.19 150);
  --ask: oklch(0.78 0.16 70);
  --shadow: 0 1px 2px 0 rgb(0 0 0 / .05);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
.dark {
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --card-foreground: oklch(0.985 0 0);
  --popover: oklch(0.205 0 0);
  --popover-foreground: oklch(0.985 0 0);
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.269 0 0);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0);
  --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --border: oklch(1 0 0 / 10%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.556 0 0);
  --shadow: none;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--background);color:var(--foreground);font-family:Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.screen.on{display:flex;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:scale(.99)}}

/* ---- schermata iniziale: i tuoi PC (verticale: una colonna · orizzontale: due) ---- */
#connect{align-items:center;justify-content:center;overflow:hidden}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow)}
.home{width:min(460px,100%);max-height:100%;padding:24px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:18px}
.intro{display:flex;flex-direction:column;gap:8px}
.home .brand{font-size:13px;font-weight:500;color:var(--muted-foreground)}
.home h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.home p{margin:0;color:var(--muted-foreground);font-size:14px;line-height:1.55}
.pcs{display:flex;flex-direction:column;gap:10px;min-height:0}
#pclist{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;scrollbar-width:none}
#pclist:empty{display:none}
.pc{position:relative;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--background);animation:fade .3s var(--ease) backwards;transition:transform .12s var(--ease),background .15s}
.dark .pc{background:var(--muted);border-color:transparent}
.pc:active{transform:scale(.985);background:var(--accent)}
.pc .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--muted);flex:none;position:relative}
.dark .pc .ico{background:var(--card)}
.pc .ico svg{width:20px;height:20px}
.pc .on-dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--background)}
.pc .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pc .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sb{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.err .sb{color:var(--destructive)}
.pc.busy .sb{color:var(--foreground)}
.pc.busy .ico{animation:nudge 1s var(--ease) infinite}
.pc .x{appearance:none;border:0;background:none;color:var(--muted-foreground);width:36px;height:36px;border-radius:var(--radius);display:grid;place-items:center;flex:none}
.pc .x:active{background:var(--accent)}
.pc .x svg,.btn svg{width:16px;height:16px}
.btn{appearance:none;border:0;border-radius:var(--radius);height:40px;padding:0 18px;font:500 14px Geist,sans-serif;background:var(--primary);color:var(--primary-foreground);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .12s var(--ease)}
.btn.sec{background:var(--secondary);color:var(--secondary-foreground)}
.btn:active{transform:scale(.98);opacity:.9}
.btn[disabled]{opacity:.5}
#err{color:var(--destructive);font-size:13px;min-height:1em}
@media (orientation: landscape){
  .home{width:min(820px,100%);grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr);align-items:start;gap:28px;padding:24px 28px}
  .intro{padding-top:4px}
}
@media (orientation: landscape) and (max-height: 420px){ .home{padding:18px 22px} .home h1{font-size:20px} }

/* ---- "Ruota il telefono": i tasti si usano solo in orizzontale ---- */
#rotate{align-items:center;justify-content:center;text-align:center}
.rot{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:300px}
.rot h2{margin:8px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.rot p{margin:0 0 8px;color:var(--muted-foreground);font-size:14px;line-height:1.5}
.rot-ico svg{width:64px;height:64px;display:block;animation:turn 2.4s var(--ease) infinite}
@keyframes turn{0%,15%{transform:rotate(0)}45%,70%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
/* In verticale i tasti spariscono subito, prima ancora che il codice reagisca alla rotazione. */
@media (orientation: portrait){ #deck.on{display:none} }

/* ---- barra ---- */
#deck{flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) minmax(0,1fr);align-items:center;gap:10px;height:34px}
.bar>*{min-width:0}
.bar>:last-child{justify-self:end}
.ghost{appearance:none;border:0;background:none;color:var(--foreground);font:500 13px Geist,sans-serif;height:32px;padding:0 10px;margin-left:-10px;border-radius:var(--radius);display:inline-flex;align-items:center;gap:8px;justify-self:start;transition:background .15s}
.ghost:active{background:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);transition:background .2s}
.dot.off{background:var(--destructive);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#deskinfo{font-size:13px;font-weight:500;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs{position:relative;display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;max-width:52vw;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs:empty{display:none}
.tab{position:relative;z-index:1;appearance:none;border:0;background:none;font:500 13px Geist,sans-serif;color:var(--muted-foreground);height:28px;padding:0 12px;border-radius:calc(var(--radius) - 3px);white-space:nowrap;transition:color .2s}
.tab.on{color:var(--foreground)}
.tabs .pill{position:absolute;top:3px;height:28px;border-radius:calc(var(--radius) - 3px);background:var(--background);box-shadow:0 1px 3px rgb(0 0 0 / .1);transition:left .3s var(--ease),width .3s var(--ease)}
.dark .tabs .pill{background:var(--input);box-shadow:none}

/* ---- griglia e tasti ---- */
#grid{flex:1;display:grid;gap:10px;min-height:0;view-transition-name:grid}
.k{position:relative;overflow:hidden;border-radius:calc(var(--radius) + 6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;min-height:0;min-width:0;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);box-shadow:var(--shadow);transition:background .2s,color .2s,border-color .2s,opacity .25s,transform .15s var(--ease);touch-action:none}
.k.press{transform:scale(.96);background:var(--accent)}
.k.on{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
.k.warn{color:var(--destructive);background:color-mix(in oklch,var(--destructive) 9%,var(--card));border-color:color-mix(in oklch,var(--destructive) 28%,transparent)}
.k.bad{background:var(--destructive);color:#fff;border-color:transparent}
.k.arm{animation:arm 1s var(--ease) infinite}
@keyframes arm{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--destructive) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.k.dim{opacity:.4}
.k.empty{background:none;border-color:transparent;box-shadow:none}
.k.lg::after{content:'';position:absolute;right:10px;top:10px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3}
.t{font-size:clamp(13px,3.6vmin,16px);font-weight:600;line-height:1.25;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.s{font-size:12px;font-weight:500;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;transition:color .2s}
.k.on .s,.k.bad .s{color:inherit;opacity:.75}
.k.warn .s{color:var(--destructive)}
.g{font-weight:600;line-height:1;font-size:clamp(28px,10vmin,44px);letter-spacing:-.04em}
.ic svg{display:block;width:clamp(28px,9.5vmin,42px);height:clamp(28px,9.5vmin,42px)}
.ic.emoji svg{width:clamp(34px,11vmin,50px);height:clamp(34px,11vmin,50px)}

/* agenti AI sulla tessera del desktop (Claude Code, Codex) */
.ags{position:absolute;right:8px;top:8px;display:flex;gap:4px;align-items:center}
.ag{position:relative;width:22px;height:22px;display:grid;place-items:center;color:currentColor}
.ag.c{color:#d97757}
.ag svg{width:18px;height:18px;display:block}
.ag.w svg{animation:spin 2.4s linear infinite}
.ag.i svg{opacity:.4}
.ag.q svg{animation:nudge 1.2s var(--ease) infinite}
.ag.q::after,.ag.d::after{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;font:700 8px/11px Geist,sans-serif;text-align:center;color:#fff;box-shadow:0 0 0 1.5px var(--card)}
.ag.q::after{content:'?';background:var(--ask)}
.ag.d::after{content:'✓';background:var(--ok)}
.k.on .ag.q::after,.k.on .ag.d::after{box-shadow:0 0 0 1.5px var(--primary)}
.ag-more{font-size:11px;font-weight:600;opacity:.7}
.k.ask{border-color:var(--ask);animation:askring 1.6s var(--ease) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes nudge{0%,100%{transform:none}50%{transform:scale(1.15)}}
@keyframes askring{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--ask) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

/* slider */
.k.sl{padding:14px 16px;gap:12px;align-items:stretch}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.sl .t{text-align:left;-webkit-line-clamp:1;font-size:14px}
.val{font-size:13px;font-weight:500;color:var(--muted-foreground)}
.trk{position:relative;background:var(--secondary);border-radius:999px;overflow:hidden}
.fil{position:absolute;left:0;bottom:0;background:var(--primary);border-radius:999px;transition:width .18s var(--ease),height .18s var(--ease),background .2s}
.drag .fil{transition:none}
.sl.h{justify-content:flex-end}
.sl.h .trk{height:8px}
.sl.h .fil{top:0}
.sl.v{align-items:center}
.sl.v .top{flex-direction:column;align-items:center;order:2;gap:2px}
.sl.v .trk{width:8px;flex:1;order:1}
.sl.v .fil{right:0}
.mu .fil{background:var(--muted-foreground)}
.na{opacity:.4}

/* mixer */
.k.mx{padding:12px 10px 10px;align-items:stretch;justify-content:flex-start;gap:8px}
.mx .t{font-size:13px;text-align:left;padding-left:4px;color:var(--muted-foreground);font-weight:500}
.chs{flex:1;display:flex;gap:4px;min-height:0}
.ch{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border-radius:var(--radius);transition:opacity .2s}
.ch .trk{width:8px;flex:1}
.ch .fil{right:0}
.ch .nm{font-size:11px;font-weight:500;color:var(--muted-foreground);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.ch .val{font-size:11px}
.ch.in{animation:fade .3s var(--ease)}
.me{margin:auto;font-size:13px;color:var(--muted-foreground);text-align:center}

/* finestre aperte */
/* griglia di al massimo 7×3 che scorre in orizzontale, con aggancio ogni 2 colonne */
.k.wn{--wc:7;--wr:3;--wg:8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--wr),minmax(0,1fr));
  grid-auto-columns:calc((100% - (var(--wc) - 1) * var(--wg)) / var(--wc));gap:var(--wg);padding:10px;align-items:stretch;justify-content:start;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:10px;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none}
.k.wn::-webkit-scrollbar{display:none}
.wt.snap{scroll-snap-align:start;scroll-snap-stop:always}
.wt{position:relative;appearance:none;border:1px solid var(--border);background:var(--background);color:var(--foreground);border-radius:var(--radius);padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:0;font:inherit;transition:transform .15s var(--ease),background .15s;animation:fade .3s var(--ease) backwards}
.wd{position:absolute;left:6px;top:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--muted);color:var(--muted-foreground);font-size:10px;font-weight:600;line-height:16px;text-align:center}
.wd.cur{background:var(--primary);color:var(--primary-foreground)}
.dark .wd{background:var(--card)}
.dark .wd.cur{background:var(--primary)}
.dark .wt{background:var(--muted);border-color:transparent}
.wt:active{transform:scale(.94);background:var(--accent)}
.wt img,.wt .av{width:30px;height:30px;border-radius:7px;flex:none}
.wt .av{display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground);font-weight:600;font-size:14px}
.dark .wt .av{background:var(--card)}
.wtt{font-size:11px;line-height:1.25;font-weight:500;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.wempty{grid-row:1/-1;grid-column:1/-1;margin:auto;font-size:13px;color:var(--muted-foreground)}

/* in riproduzione */
.k.now{container-type:size;padding:12px}
.now .in{display:flex;align-items:center;gap:14px;width:100%;height:100%}
.now .art{height:100%;aspect-ratio:1;max-width:45%;border-radius:var(--radius);background:var(--muted) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted-foreground);font-size:22px}
.now .art.has span{display:none}
.now .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.now .ti{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .ar{font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-top:8px;padding:6px 0;touch-action:none}
.prog .trk{height:4px}
.prog .fil{top:0;transition:none}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-foreground);margin-top:2px}
@container (max-aspect-ratio: 5/4){.now .in{justify-content:center}.now .art{max-width:100%}.now .meta{display:none}}

#lost{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);box-shadow:0 4px 12px rgb(0 0 0 / .12);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;display:none;animation:drop .3s var(--ease)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-8px)}}

/* cambio pagina */
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(grid){animation:out .22s var(--ease) both}
::view-transition-new(grid){animation:in .28s var(--ease) both}
.back::view-transition-old(grid){animation-name:out-back}
.back::view-transition-new(grid){animation-name:in-back}
@keyframes out{to{opacity:0;transform:translateX(-28px)}}
@keyframes in{from{opacity:0;transform:translateX(28px)}}
@keyframes out-back{to{opacity:0;transform:translateX(28px)}}
@keyframes in-back{from{opacity:0;transform:translateX(-28px)}}
@media (prefers-reduced-motion:reduce){*,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="connect" class="screen on">
  <div class="card home">
    <div class="intro">
      <div class="brand">Plancia</div>
      <h1 id="htitle">I tuoi PC</h1>
      <p id="hint"></p>
    </div>
    <div class="pcs">
      <div id="pclist"></div>
      <div><button id="go" class="btn"></button></div>
      <div id="err"></div>
    </div>
  </div>
</section>

<section id="rotate" class="screen">
  <div class="rot">
    <div id="rotico" class="rot-ico"></div>
    <h2>Ruota il telefono</h2>
    <p id="rotname"></p>
    <button id="rotcancel" class="btn sec">Annulla</button>
  </div>
</section>

<section id="deck" class="screen">
  <div class="bar">
    <button id="refresh" class="ghost"><span id="dot" class="dot"></span><span id="rtext">Aggiorna</span></button>
    <div id="tabs" class="tabs"></div>
    <div id="deskinfo"></div>
  </div>
  <div id="grid"></div>
  <div id="lost">Riconnessione…</div>
</section>

<script src="icons.js"></script>
<script>
// Protocollo: vedi windows/Plancia/BleServer.cs e TrayApp.cs
const U = n => `7a1e000${n}-5c3b-4c1e-9f1a-2b7d9c3e4f10`;
const SVC = U(0), CMD = U(1), STATE = U(2), LAYOUT = U(3), INFO = U(4), ART = U(5), WINDOWS = U(6), ICON = U(7);
const CHUNK = 480; // come BleServer.Chunk
const HOLD_MS = 450, ARM_MS = 2500;
const $ = id => document.getElementById(id);
const dec = new TextDecoder(), enc = new TextEncoder();

// Tema chiaro/scuro come il telefono.
const darkQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  document.documentElement.classList.toggle('dark', darkQ.matches);
  document.querySelector('meta[name=theme-color]').content = darkQ.matches ? '#0a0a0a' : '#ffffff';
}
applyTheme();
darkQ.addEventListener('change', applyTheme);

// Icone Fluent (icons.js). fill null = colore del testo, così seguono lo stato del tasto.
const svgCache = {};
const svgOf = name => svgCache[name] ??= ICONS[name]
  ? `<svg viewBox="0 0 ${ICONS[name].s} ${ICONS[name].s}">${ICONS[name].p.map(([f, d]) => `<path d="${d}" fill="${f || 'currentColor'}"/>`).join('')}</svg>`
  : '';
// Stesse parole chiave di KeyText.IsHeadphones.
const isHeadphones = n => /cuffi|auricolar|headphone|headset|earbud|buds|airpods/i.test(n || '');
const pop = el => el.animate([{ transform: 'scale(.6)', opacity: .2 }, { transform: 'scale(1.08)' }, { transform: 'none', opacity: 1 }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

let device, ch = {}, layout = null, info = {}, infoAt = 0, st = null, artVer = -1, artUrl = null;
let wins = null, winVer = null, iconsVer = 0;
let page = 0, stack = [], views = [], wake, retry = 0, connecting = false, firstRender = true;
const armed = new Set();

// ---- Coda GATT: una operazione alla volta, i comandi passano davanti alle letture lunghe ----
const hi = [], lo = [];
let busy = false;
function op(fn, prio) {
  return new Promise((res, rej) => { (prio ? hi : lo).push({ fn, res, rej }); pump(); });
}
async function pump() {
  if (busy) return;

    const t = (hi.length ? hi : lo).shift();
    try { t.res(await t.fn()); } catch (e) { t.rej(e); }
  }

}
const pend = {};

}

// Valori lunghi a blocchi: {"o":[id,offset]} su COMMAND, poi lettura.

// ---- Pagine di default (DefaultPages.cs): regola unica per tutte ----

// Evento che scatta → apre la pagina Auto; evento finito → si torna dov'eri e la scheda sparisce.
function autoPages(prev, s) {

  layout.pages.forEach((p, i) => {

    const was = triggered(p, prev), now = triggered(p, s);

// ---- Schermate ----

function err(m) { $('err').textContent = m || ''; }

// ---- I tuoi PC: quelli già autorizzati si collegano con un tocco; il popup di Chrome serve solo per aggiungerne uno ----
// (Chrome non permette di personalizzare il popup né di vedere i dispositivi vicini prima che tu ne scelga uno.)

  try { localStorage.setItem(KNOWN, JSON.stringify(k)); } catch { }
}

// Righe della lista: { id, dev }. dev = dispositivo pronto (collegamento diretto) oppure null (si conferma nel popup di Chrome).
let pcs = [], pcBusy = null;

const canList = !!navigator.bluetooth?.getDevices;
// Dispositivi ottenuti in questa sessione: servono quando Chrome non fornisce l'elenco dei PC autorizzati (getDevices),
// cosa frequente su Android. Così almeno il PC appena usato si ricollega con un tocco.

const ago = t => {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'adesso';
  if (m < 60) return `${m} min fa`;
  const d = new Date(t), today = new Date().toDateString() === d.toDateString();
  return (today ? 'oggi ' : d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) + ' ') + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
};

// Tre fonti: PC autorizzati di Chrome, PC usati in questa sessione, PC ricordati dalla pagina (nome e ultimo collegamento).
async function listPcs() {
  const granted = canList ? await navigator.bluetooth.getDevices().catch(() => []) : [];
  const byId = new Map();
  for (const d of [...granted, ...mem.values()]) byId.set(d.id, d);
  const k = known();
  pcs = [...byId.values()].map(dev => ({ id: dev.id, dev }));
  for (const id of Object.keys(k)) if (!byId.has(id)) pcs.push({ id, dev: null });
  pcs.sort((a, b) => (k[b.id]?.last || 0) - (k[a.id]?.last || 0));
  renderPcs();
  watchPcs(true);
}

// "Acceso": segnali Bluetooth dei PC già autorizzati. Su Chrome per Android è ancora sperimentale: se manca, niente pallino.
function watchPcs(on) {
  for (const [, c] of watching) c.abort();
  watching.clear();
  if (!on) return;
  for (const { dev: d } of pcs) {
    if (!d?.watchAdvertisements) continue;
    const c = new AbortController();
    watching.set(d.id, c);
    d.onadvertisementreceived = () => { const was = Date.now() - (seen[d.id] || 0) < 15000; seen[d.id] = Date.now(); if (!was) renderPcs(); };
    d.watchAdvertisements({ signal: c.signal }).catch(() => watching.delete(d.id));
  }
}

function renderPcs() {
  const list = $('pclist'), k = known();
  list.innerHTML = '';
  for (const pc of pcs) {
    const { id, dev } = pc, info = k[id] || {}, online = Date.now() - (seen[id] || 0) < 15000;
    const row = document.createElement('div');
    row.className = 'pc' + (pcBusy === id ? ' busy' : pcErr[id] ? ' err' : '');
    row.innerHTML = `<span class="ico">${svgOf('desktop')}${online ? '<span class="on-dot"></span>' : ''}</span><span class="txt"><span class="nm"></span><span class="sb"></span></span><button class="x" aria-label="Rimuovi">${svgOf('dismiss')}</button>`;
    row.querySelector('.nm').textContent = info.name || dev?.name || 'PC';
    const when = info.last ? `Ultimo collegamento ${ago(info.last)}` : '';
    row.querySelector('.sb').textContent = pcBusy === id ? 'Connessione…' : pcErr[id] || (online ? 'Acceso · tocca per collegarti'
      : dev ? when || 'Tocca per collegarti' : (when ? when + ' · ' : '') + 'tocca e confermalo nel popup');
    row.addEventListener('click', e => { if (!e.target.closest('.x')) openPc(pc); });
    // Rimuovere un PC ritira anche l'autorizzazione di Chrome (dove possibile): per riusarlo si riaggiunge dal popup.
    row.querySelector('.x').addEventListener('click', async () => {
      if (!confirm(`Rimuovere "${row.querySelector('.nm').textContent}" dai tuoi PC?`)) return;
      try { await dev?.forget?.(); } catch { }
      mem.delete(id);
      forgetKnown(id);
      listPcs();
    });
    list.append(row);
  }
  const has = pcs.length > 0;
  $('htitle').textContent = has ? 'I tuoi PC' : 'Collega il PC';
  $('go').innerHTML = has ? `${svgOf('add')}<span>Aggiungi PC</span>` : '<span>Collega</span>';
  $('go').classList.toggle('sec', has);
  $('hint').textContent = !navigator.bluetooth
    ? (!isSecureContext ? 'Questa pagina deve essere aperta da un indirizzo https:// per usare il Bluetooth.' : 'Il browser non supporta Web Bluetooth. Usa Chrome per Android.')
    : has ? 'Tocca un PC per collegarti. Avvia prima Plancia sul PC. Ruota il telefono in verticale per scollegarti e tornare qui.'
      : "Avvia Plancia sul PC, poi tocca Collega e scegli il PC dall'elenco. La prima volta Android chiede di associare i dispositivi.";
  $('go').disabled = !navigator.bluetooth;
}

// Popup di Chrome (serve un tocco): nuovo PC, o PC ricordato ma non fornito da Chrome.
async function choose() {
  const d = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
  mem.set(d.id, d);
  return d;
}

async function openPc(pc) {
  if (pcBusy) return;
  err('');
  goFull(); // schermo intero ora che c'è un tocco
  let d = pc.dev;
  if (!d) {
    try { d = await choose(); } catch (e) { if (e.name !== 'NotFoundError') err(e.message); return; }
    if (d.id !== pc.id) { forgetKnown(pc.id); await listPcs(); } // scelto un altro PC dal popup
  }
  pcBusy = d.id;
  delete pcErr[d.id];
  renderPcs();
  try { await connect(d, true); }
  catch (e) { pcErr[d.id] = e?.message?.includes('compatibile') ? e.message : 'Non raggiungibile: avvia Plancia sul PC e riprova'; }
  pcBusy = null;
  renderPcs();
}

$('go').addEventListener('click', async () => {
  err('');
  try {
    const d = await choose();
    await listPcs();
    await openPc(pcs.find(p => p.id === d.id) || { id: d.id, dev: d });
  } catch (e) { if (e.name !== 'NotFoundError') err(e.message); }
});

// ---- Connessione ----
// fromList: collegamento scelto dall'utente; se fallisce non si riprova da soli (niente tentativi a vuoto su un PC spento).
async function connect(d, fromList) {
  if (connecting) return;
  connecting = true;
  try {
    device = d;
    device.removeEventListener('gattserverdisconnected', onLost);
    device.addEventListener('gattserverdisconnected', onLost);
    resetQueue();
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    const [cmd, state, lay, inf, art, win, icon] = await Promise.all([CMD, STATE, LAYOUT, INFO, ART, WINDOWS, ICON].map(u => svc.getCharacteristic(u)));
    ch = { cmd, state, layout: lay, info: inf, art, win, icon };
    winVer = null;
    await loadLayout();
    remember(d, layout.name);
    state.removeEventListener('characteristicvaluechanged', onState);
    state.addEventListener('characteristicvaluechanged', onState);
    await op(() => state.startNotifications());
    st = null;
    onStateBytes(await op(() => state.readValue()));
    retry = 0;
    $('lost').style.display = 'none';
    $('dot').classList.remove('off');
    // Annullato nel frattempo (telefono ruotato in verticale): si chiude il collegamento appena aperto.
    if (device !== d) { try { d.gatt.disconnect(); } catch { } return; }
    watchPcs(false);
    enterDeck();
    keepAwake();
  } catch (e) {
    if (fromList) { device = null; try { d.gatt.disconnect(); } catch { } }
    throw e;
  } finally { connecting = false; }
}

async function loadLayout() {
  const l = json(await readBig(ch.layout, 3));
  if (!Array.isArray(l.pages)) throw new Error('Versione di Plancia sul PC non compatibile: aggiornala.');
  // Stesso ordine di AppConfig.AppSliders(): gli slider configurati, poi le app del mixer (max 11 in tutto).
  let s = 0;
  for (const p of l.pages) for (const k of p.keys) if (k.a === 'app.slider') k._s = s < 11 ? s++ : -1;
  l._base = s;
  layout = l;
  if (page >= l.pages.length || l.pages[page].v === 'off') { page = firstVisible(); stack = []; }
  stack = stack.filter(p => p < l.pages.length && l.pages[p].v !== 'off');
  firstRender = true;
  render();
}

async function loadInfo() {
  info = json(await readBig(ch.info, 4));
  infoAt = performance.now();
  const needArt = layout?.pages.some(p => p.keys.some(k => k.a === 'media.now'));
  if (needArt && info.art !== artVer) {
    const bytes = await readBig(ch.art, 5);
    artVer = info.art;
    if (artUrl) URL.revokeObjectURL(artUrl);
    artUrl = bytes.length ? URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })) : null;
  }

}

// Icone delle app: arrivano una volta sola, poi restano sul telefono.
const icons = {};

async function loadWindows() {
  const w = json(await readBig(ch.win, 6));
  wins = w;
  winVer = info.wv;
  update();
  for (const [j, app] of (w.a || []).entries()) {
    if (!app.k || iconOf(app.k) || app.k in icons && icons[app.k] === '') continue;
    await op(() => write({ ic: [w.v, j] }, true));
    const bytes = await readBig(ch.icon, 7);
    let url = '';
    if (bytes.length) {
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      url = 'data:image/png;base64,' + btoa(bin);
      try { localStorage.setItem('plancia-ic:' + app.k, url); } catch { }
    }
    icons[app.k] = url; // '' = app senza icona: non si richiede più
    iconsVer++;
    update();
  }
}

// Ricarica layout/info/finestre quando cambia la loro versione. Una sola sincronizzazione alla volta.
const want = { layout: false, info: false, win: false };
let syncP = null;
function sync() {
  return syncP ??= (async () => {
    try {
      while (want.layout || want.info || want.win) {
        if (want.layout) { want.layout = false; await loadLayout(); want.info = true; }
        if (want.info) { want.info = false; await loadInfo(); }
        if (want.win) { want.win = false; await loadWindows(); }
      }
    } catch { }
  })().finally(() => { syncP = null; });
}

function onState(e) { onStateBytes(e.target.value); }
function onStateBytes(dv) {
  const s = parseState(dv), prev = st;
  st = s;
  if (prev && s.v !== prev.v) want.layout = true;
  if (!prev || s.iv !== prev.iv) want.info = true;
  if (want.layout || want.info) sync();
  autoPages(prev, s);
  // Le schede seguono la visibilità delle pagine (una pagina Auto compare e sparisce con il suo evento).
  const vis = layout ? layout.pages.map((_, i) => visible(i)).join() : '';
  if (vis !== onStateBytes.vis) { onStateBytes.vis = vis; if (layout) renderTabs(); }
  update();
}

function onLost() {
  resetQueue();
  if (!device) return;
  $('dot').classList.add('off');
  $('rtext').textContent = 'Riconnetti';
  $('lost').style.display = 'block';
  if (retry > 8) { leave('Connessione persa. Tocca il PC per ricollegarti.'); retry = 0; return; }
  const wait = Math.min(8000, 500 * 2 ** retry++);
  setTimeout(() => { if (device && !device.gatt.connected) connect(device).then(() => { $('rtext').textContent = 'Aggiorna'; }).catch(onLost); }, wait);
}

// Scollega e torna alla schermata iniziale (telefono in verticale, o collegamento perso del tutto).
function leave(message) {
  const d = device;
  device = null; // così la disconnessione non fa partire i tentativi di riconnessione
  resetQueue();
  ch = {};
  st = null;
  try { d?.gatt.connected && d.gatt.disconnect(); } catch { }
  try { wake?.release?.(); } catch { }
  wake = null;
  $('lost').style.display = 'none';
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  show('connect');
  err(message || '');
  listPcs();
}

// I tasti si usano solo in orizzontale. Collegandosi in verticale compare "Ruota il telefono" finché non lo giri;
// girandolo in verticale mentre usi i tasti ci si scollega e si torna subito alla schermata iniziale.
// (Non si blocca l'orientamento: col blocco, girare il telefono non scollegherebbe più.)
const portraitQ = matchMedia('(orientation: portrait)');
function enterDeck() {
  if (portraitQ.matches) {
    $('rotname').textContent = `Collegato a ${layout?.name || 'PC'}. Gira il telefono in orizzontale per usare i tasti.`;
    show('rotate');
  } else {
    show('deck');
  }
}
$('rotico').innerHTML = svgOf('phone');
$('rotcancel').addEventListener('click', () => leave());
function onOrientation() {
  if (!device) return;
  const waiting = $('rotate').classList.contains('on');
  if (portraitQ.matches) { if (!waiting) leave(); }
  else if (waiting) { show('deck'); renderTabs.last = null; render(); }
}
// Più segnali per lo stesso controllo: non tutti i browser li mandano tutti.
portraitQ.addEventListener('change', onOrientation);
addEventListener('resize', onOrientation);
screen.orientation?.addEventListener?.('change', onOrientation);

// Pulsante in alto: rilegge layout e info dal PC, o riconnette se il collegamento è caduto.
$('refresh').addEventListener('click', async () => {
  const t = $('rtext');
  if (t.dataset.busy) return;
  t.dataset.busy = 1;
  const t0 = performance.now();
  try {
    if (device?.gatt.connected) { t.textContent = 'Aggiorno…'; want.layout = true; want.win = hasKey('windows'); await sync(); }
    else if (device) { t.textContent = 'Connessione…'; retry = 0; await connect(device); }
    else leave();
  } catch { }
  await new Promise(r => setTimeout(r, Math.max(0, 500 - (performance.now() - t0))));
  t.textContent = device?.gatt.connected ? 'Aggiorna' : 'Riconnetti';
  delete t.dataset.busy;
});

async function keepAwake() {
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && device?.gatt.connected) keepAwake(); });

// Schermo intero al primo tocco, senza bloccare l'orientamento (ruotare in verticale deve poter scollegare).
function goFull() {
  if (document.fullscreenElement || matchMedia('(display-mode: fullscreen)').matches) return;
  document.documentElement.requestFullscreen?.().catch(() => {});
}

// ---- Pagine (con transizione a scorrimento) ----
function setPage(p, back) {
  if (!layout || p === page || p < 0 || p >= layout.pages.length) return;
  const swap = () => { page = p; render(); };
  const root = document.documentElement;
  root.classList.toggle('back', back ?? p < page);
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(swap);
  else swap();
}
// Un tasto "Apri pagina" può aprire anche una pagina Auto fuori dal suo evento; una disattivata no.
function goPage(p) {
  if (!layout || p === page || layout.pages[p]?.v === 'off') return;
  stack.push(page);
  setPage(p, p < page);
}
function goBack() {
  let p = stack.pop();
  while (p != null && layout.pages[p]?.v === 'off') p = stack.pop();
  setPage(p ?? firstVisible(), true);
}

function renderTabs() {
  const box = $('tabs'), keep = box.scrollLeft;
  box.innerHTML = '';
  // Schede: le pagine visibili, più quella aperta (es. una pagina Auto aperta da un tasto).
  const tabs = layout.pages.map((p, i) => ({ p, i })).filter(({ i }) => visible(i) || i === page);
  if (tabs.length < 2) return;
  const pill = document.createElement('div');
  pill.className = 'pill';
  box.append(pill);
  tabs.forEach(({ p, i }) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === page ? ' on' : '');
    b.textContent = p.n || `Pagina ${i + 1}`;
    b.addEventListener('click', () => { stack = []; autoFrom = null; setPage(i); });
    box.append(b);
  });
  box.scrollLeft = keep;
  const on = box.querySelector('.tab.on');
  const place = animate => {
    if (!on) return;
    if (!animate) pill.style.transition = 'none';
    pill.style.left = on.offsetLeft + 'px';
    pill.style.width = on.offsetWidth + 'px';
    if (!animate) { pill.offsetWidth; pill.style.transition = ''; }
  };
  // Parte dalla scheda precedente e scivola su quella nuova.
  const prev = renderTabs.last;
  if (prev) { pill.style.transition = 'none'; pill.style.left = prev.left + 'px'; pill.style.width = prev.width + 'px'; pill.offsetWidth; pill.style.transition = ''; }
  requestAnimationFrame(() => {
    place(!!prev);
    renderTabs.last = on ? { left: on.offsetLeft, width: on.offsetWidth } : null;
    // Schede che non ci stanno: quella attiva resta sempre in vista.
    if (on) box.scrollLeft = Math.max(0, on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2);
  });
}

// ---- Griglia ----
function render() {
  if (!layout) return;

  const portrait = innerHeight > innerWidth, g = $('grid');
  // In verticale la griglia viene trasposta: colonne e righe si scambiano.
  g.style.gridTemplateColumns = `repeat(${portrait ? R : C},minmax(0,1fr))`;
  g.style.gridTemplateRows = `repeat(${portrait ? C : R},minmax(0,1fr))`;
  g.innerHTML = '';
  views = [];
  const covered = new Set();
  let order = 0;
  for (let i = 0; i < n; i++) {
    if (covered.has(i)) continue;
    const k = P.keys[i] || { a: 'none' }, w = k.w || 1, h = k.h || 1, c = i % C, r = Math.floor(i / C);
    for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) if (dx || dy) covered.add(i + dy * C + dx);
    const v = makeKey(k, i);
    v.el.style.gridColumn = portrait ? `${r + 1} / span ${h}` : `${c + 1} / span ${w}`;
    v.el.style.gridRow = portrait ? `${c + 1} / span ${w}` : `${r + 1} / span ${h}`;
    g.appendChild(v.el);
    if (firstRender && k.a !== 'none')
      v.el.animate([{ opacity: 0, transform: 'translateY(8px) scale(.98)' }, { opacity: 1, transform: 'none' }],
        { duration: 320, delay: order++ * 22, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    views.push(v);
  }
  firstRender = false;
  renderTabs();
  update();
}
let resizeT;
// In verticale i tasti non si vedono: niente ridisegno inutile (e niente griglia verticale per un attimo).
addEventListener('resize', () => { clearTimeout(resizeT); if (!portraitQ.matches) resizeT = setTimeout(() => { renderTabs.last = null; render(); }, 120); });

function update() {
  if (!layout || !st) return;
  for (const v of views) v.upd();
  const dk = layout.pages.flatMap(p => p.keys).find(k => k.a === 'desk' && k.n === st.d && k.l);
  const dn = dk ? dk.l : (info.ds || [])[st.d - 1];
  $('deskinfo').textContent = dn ? `${dn} · ${st.d}/${st.c}` : `Desktop ${st.d}/${st.c}`;
}

// Icona e aspetto del tasto in base allo stato del PC (stessa icona di base di KeyText.Icon).
// on = attivo · warn = muto/spento (rosso) · bad = rosso pieno · dim = non disponibile · s = testo al posto dell'etichetta
function look(k, i) {
  const f = st.f, meet = inMeeting();
  switch (k.a) {
    case 'deskNext': return { icon: 'arrow_circle_right' };
    case 'deskPrev': return { icon: 'arrow_circle_left' };
    case 'window.toDesk': return { icon: 'desktop_arrow_right' };
    case 'window.focus': return { icon: 'window_arrow_up' };
    case 'media.playpause': return { icon: st.m === 1 ? 'pause' : 'play', dim: !st.m };
    case 'media.next': return { icon: 'next', dim: !st.m };
    case 'media.prev': return { icon: 'previous', dim: !st.m };
    case 'media.shuffle': return { icon: 'shuffle', on: st.sh, dim: !st.csh };
    case 'media.repeat': return { icon: st.rp === 1 ? 'repeat_one' : 'repeat', on: st.rp > 0, dim: !st.crp };
    case 'vol.up': return { icon: 'speaker' };
    case 'vol.down': return { icon: 'speaker_low' };
    case 'vol.mute': return st.mu ? { icon: 'speaker_mute', warn: 1 } : { icon: 'speaker' };
    case 'audio.output': return { icon: isHeadphones(info.o) ? 'headphones' : 'speaker', s: info.o || k.l };
    case 'mic.mute': return f & 1 ? { icon: 'mic_off', warn: 1 } : { icon: 'mic' };
    case 'teams.mute':
      return [{ icon: 'mic', dim: 1 }, { icon: 'mic' }, { icon: 'mic_off', warn: 1 }, { icon: 'mic', s: 'Tocca per associare' }][st.tm] || { icon: 'mic' };
    case 'teams.video': return meet && f & 2 ? { icon: 'video', on: 1 } : { icon: 'video_off', dim: !meet };
    case 'teams.hand': return { icon: 'hand', on: meet && f & 4, dim: !meet };
    case 'teams.blur': return { icon: 'blur', on: meet && f & 8, dim: !meet };
    case 'teams.leave': return armed.has(i) ? { icon: 'call_end', bad: 1, arm: 1, s: 'Tocca di nuovo' } : { icon: 'call_end', bad: meet, dim: !meet };
    case 'teams.react': return { icon: 'emoji_' + (k.r || 'like'), dim: !meet };
    case 'launch': return { icon: 'open' };
    case 'hotkey': return { icon: 'keyboard' };
    case 'macro': return { icon: 'flash' };
    case 'page': return { icon: 'folder' };
    case 'page.back': return { icon: 'arrow_left' };
  }
  return {};
}

function makeKey(k, i) {
  const el = document.createElement('div');
  el.className = 'k';
  if (k.a === 'none') { el.classList.add('empty'); return { el, upd() {} }; }
  if (k.a === 'vol.slider' || k.a === 'app.slider') return makeSlider(k, el);
  if (k.a === 'mixer') return makeMixer(k, el);
  if (k.a === 'windows') return makeWindows(k, el);
  if (k.a === 'media.now') return makeNow(k, i, el);
  if (k.lg) el.classList.add('lg');
  bindPress(el, k, i);

  const main = document.createElement('div'), sub = document.createElement('div');
  sub.className = 's';
  el.append(main, sub);
  const isDesk = k.a === 'desk';
  if (isDesk) { main.className = 'g'; main.textContent = String(k.n || ''); }
  const ags = isDesk && k.ag !== 0 ? el.appendChild(Object.assign(document.createElement('div'), { className: 'ags' })) : null;
  let agSig = '';

  let shown;
  return {
    el, upd() {
      const x = isDesk ? { on: st.d === k.n, s: k.l || (info.ds || [])[k.n - 1] } : look(k, i);
      if (ags) agSig = agents(ags, el, k.n, agSig);
      if (!isDesk && x.icon !== shown) {
        const first = shown === undefined;
        shown = x.icon;
        if (x.icon && ICONS[x.icon]) { main.className = 'ic' + (x.icon.startsWith('emoji_') ? ' emoji' : ''); main.innerHTML = svgOf(x.icon); }
        else { main.className = 't'; main.textContent = k.l || ''; }
        if (!first) pop(main);
      }
      for (const c of ['on', 'warn', 'bad', 'dim', 'arm']) el.classList.toggle(c, !!x[c]);
      const s = main.className === 't' ? '' : (x.s ?? k.l) || '';
      if (sub.textContent !== s) sub.textContent = s;
      sub.style.display = s ? '' : 'none';
    }
  };
}

// Agenti AI al lavoro nel desktop n (info.ag = [[desktop, "c" Claude Code | "x" Codex, stato]], vedi TrayApp.AgentsByDesktop).
// Logo che gira = lavora · logo con ? e bordo ambra sulla tessera = aspetta una tua risposta · spunta = ha finito · sbiadito = fermo.
const AG_ORDER = { q: 0, w: 1, d: 2, i: 3 };
function agents(box, key, n, prev) {
  const list = (info.ag || []).filter(a => a[0] === n).sort((a, b) => AG_ORDER[a[2]] - AG_ORDER[b[2]]);
  const sig = list.map(a => a[1] + a[2]).join(',');
  if (sig === prev) return prev;
  box.innerHTML = '';
  // Al massimo 2 loghi (prima chi aspetta te, poi chi lavora) + contatore, per non coprire il numero del desktop.
  for (const [, kind, state] of list.slice(0, 2)) {
    const b = document.createElement('span');
    b.className = `ag ${kind} ${state}`;
    b.innerHTML = svgOf(kind === 'x' ? 'logo_openai' : 'logo_claude');
    b.title = (kind === 'x' ? 'Codex' : 'Claude Code') + ' · ' + ({ w: 'al lavoro', q: 'aspetta una tua risposta', d: 'ha finito', i: 'fermo' }[state] || '');
    box.append(b);
  }
  if (list.length > 2) box.insertAdjacentHTML('beforeend', `<span class="ag-more">+${list.length - 2}</span>`);
  key.classList.toggle('ask', list.some(a => a[2] === 'q'));
  if (prev && sig) box.animate([{ transform: 'scale(.7)', opacity: .3 }, { transform: 'none', opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
  return sig;
}

// Tocco breve subito; con pressione lunga configurata si decide al rilascio.
function bindPress(el, k, i) {
  let timer = 0, done = true;
  el.addEventListener('pointerdown', () => {
    goFull();
    el.classList.add('press');
    navigator.vibrate?.(10);
    if (!k.lg) { fire(k, i, false); setTimeout(() => el.classList.remove('press'), 140); return; }
    done = false;
    timer = setTimeout(() => {
      done = true;
      el.classList.remove('press');
      navigator.vibrate?.([15, 40, 15]);
      fire(k.lg, i, true);
    }, HOLD_MS);
  });
  const end = cancel => () => {
    if (!k.lg || done) return;
    clearTimeout(timer);
    done = true;
    el.classList.remove('press');
    if (!cancel) fire(k, i, false);
  };
  el.addEventListener('pointerup', end(false));
  el.addEventListener('pointercancel', end(true));
  el.addEventListener('pointerleave', end(true));
}

function fire(def, i, isLong) {
  if (def.a === 'page') return goPage(def.p || 0);
  if (def.a === 'page.back') return goBack();
  // Abbandona: il primo tocco arma il tasto, il secondo (entro 2,5 s) chiude la riunione.
  if (def.a === 'teams.leave' && !isLong) {
    if (!armed.has(i)) {
      armed.add(i);
      navigator.vibrate?.([30, 60, 30]);
      setTimeout(() => { armed.delete(i); update(); }, ARM_MS);
      return update();
    }
    armed.delete(i);
  }
  send({ k: isLong ? [page, i, 1] : [page, i] });
  setTimeout(update, 0);
}

// Controllo di volume trascinabile: durante il trascinamento (e poco dopo) si ignora il valore del PC, che arriva in ritardo.
function volume(host, trk, fil, remote, set, vertical) {
  let local = -1, holdUntil = 0, dragging = false;
  const at = e => {
    const r = trk.getBoundingClientRect();
    const x = vertical() ? (r.bottom - e.clientY) / r.height : (e.clientX - r.left) / r.width;
    return Math.round(Math.min(1, Math.max(0, x)) * 100);
  };
  const move = e => { local = at(e); set(local); api.draw(); };
  host.addEventListener('pointerdown', e => {
    if (!st || remote() < 0) return;
    e.stopPropagation();
    goFull();
    dragging = true;
    host.classList.add('drag');
    host.setPointerCapture(e.pointerId);
    navigator.vibrate?.(8);
    move(e);
  });
  host.addEventListener('pointermove', e => { if (dragging) move(e); });
  const stop = () => { if (!dragging) return; dragging = false; host.classList.remove('drag'); holdUntil = Date.now() + 1200; };
  host.addEventListener('pointerup', stop);
  host.addEventListener('pointercancel', stop);
  const api = {
    value: () => dragging || Date.now() < holdUntil ? local : remote(),
    draw() {
      const v = api.value(), p = Math.max(0, v) + '%', vert = vertical();
      fil.style.width = vert ? '' : p;
      fil.style.height = vert ? p : '';
      return v;
    }
  };
  return api;
}

function makeSlider(k, el) {
  el.classList.add('sl');
  el.innerHTML = '<div class="top"><span class="t"></span><span class="val"></span></div><div class="trk"><div class="fil"></div></div>';
  const [top, trk] = el.children, val = top.lastChild, fil = trk.firstChild;
  const isVol = k.a === 'vol.slider';
  top.firstChild.textContent = k.l || (isVol ? 'Volume' : 'App');
  const horiz = () => el.clientWidth >= el.clientHeight * 0.9;
  const ctl = volume(el, trk, fil,
    () => isVol ? st.vol : k._s >= 0 ? (st.apps[k._s] ?? -1) : -1,
    v => sendLatest(isVol ? 'vol' : 'app' + k._s, isVol ? { v } : { av: [k._s, v] }),
    () => !horiz());
  return {
    el, upd() {
      const h = horiz();
      el.classList.toggle('h', h);
      el.classList.toggle('v', !h);
      const v = ctl.draw();
      el.classList.toggle('na', v < 0);
      el.classList.toggle('mu', isVol && st.mu);
      val.textContent = v < 0 ? (isVol ? '—' : 'Non attiva') : (isVol && st.mu ? 'Muto · ' : '') + v + '%';
    }
  };
}

// Mixer: uno slider per ogni app con l'audio aperto (elenco e volumi arrivano dal PC).
function makeMixer(k, el) {
  el.classList.add('mx');
  el.innerHTML = '<div class="t"></div><div class="chs"></div><div class="me">Nessuna app con l\'audio aperto</div>';
  const [title, chs, empty] = el.children;
  title.textContent = k.l || 'Mixer';
  let names = null, chans = [];
  const build = list => {
    chs.innerHTML = '';
    chans = list.map((name, j) => {
      const c = document.createElement('div');
      c.className = 'ch in';
      c.innerHTML = '<div class="val"></div><div class="trk"><div class="fil"></div></div><div class="nm"></div>';
      c.lastChild.textContent = name;
      const idx = layout._base + j, trk = c.children[1];
      chs.append(c);
      const ctl = volume(c, trk, trk.firstChild, () => st.apps[idx] ?? -1, v => sendLatest('mx' + idx, { av: [idx, v] }), () => true);
      return { c, ctl };
    });
  };
  return {
    el, upd() {
      const list = info.mx || [];
      if (list.join('\n') !== names) { names = list.join('\n'); build(list); }
      empty.style.display = list.length ? 'none' : '';
      chs.style.display = list.length ? '' : 'none';
      for (const { c, ctl } of chans) {
        const v = ctl.draw();
        c.classList.toggle('na', v < 0);
        c.firstChild.textContent = v < 0 ? '—' : v + '%';
      }
    }
  };
}

// Finestre aperte sul PC in una griglia di al massimo 7×3 che scorre in orizzontale (aggancio ogni 2 colonne).
// Ordinate per desktop, col numero del desktop sul quadratino. Tocco = vai a quel desktop e porta la finestra in primo piano.
const WIN_COLS = 7, WIN_ROWS = 3, WIN_MIN_W = 76, WIN_MIN_H = 72, WIN_SNAP = 2;
function makeWindows(k, el) {
  el.classList.add('wn');
  el.addEventListener('pointerdown', goFull);
  let sig = null, first = true;
  // "Documento - Visual Studio Code" -> "Documento" (il nome dell'app c'è già nell'icona)
  const short = (t, app) => {
    for (const sep of [' - ', ' — ', ' | ']) if (app && t.endsWith(sep + app) && t.length > app.length + sep.length) return t.slice(0, -(app.length + sep.length));
    return t;
  };
  // Colonne e righe visibili: al massimo 7×3, meno se il tasto è piccolo (i quadratini non scendono sotto una misura minima).
  // In verticale la griglia si ruota come il resto della pagina: al massimo 3 colonne × 7 righe.
  const fit = () => {
    const gap = 8, w = el.clientWidth - 20, h = el.clientHeight - 20, tall = h > w;
    const cols = Math.max(1, Math.min(tall ? WIN_ROWS : WIN_COLS, Math.floor((w + gap) / (WIN_MIN_W + gap))));
    const rows = Math.max(1, Math.min(tall ? WIN_COLS : WIN_ROWS, Math.floor((h + gap) / (WIN_MIN_H + gap))));
    el.style.setProperty('--wc', cols);
    el.style.setProperty('--wr', rows);
    dims = cols + 'x' + rows;
    return rows;
  };
  const build = () => {
    el.innerHTML = '';
    const rows = fit();
    const list = (wins?.w || []).slice().sort((a, b) => (a.d || 99) - (b.d || 99)); // sort stabile: dentro il desktop resta lo z-order
    if (!list.length) {
      el.innerHTML = `<div class="wempty">${wins ? 'Nessuna finestra aperta' : 'Caricamento…'}</div>`;
      el.firstChild.style.gridColumn = `1 / span ${WIN_COLS}`;
      el.firstChild.style.gridRow = `1 / span ${rows}`;
      return;
    }
    list.forEach((w, n) => {
      const app = wins.a[w.a] || {}, b = document.createElement('button');
      // Punto di aggancio sul primo quadratino di ogni coppia di colonne.
      b.className = 'wt' + (n % (rows * WIN_SNAP) === 0 ? ' snap' : '');
      if (first) b.style.animationDelay = Math.min(n * 18, 400) + 'ms';
      else b.style.animation = 'none';
      const ic = iconOf(app.k);
      b.innerHTML = (ic ? `<img alt="">` : `<span class="av"></span>`) + `<span class="wd${w.d === st.d ? ' cur' : ''}"></span><span class="wtt"></span>`;
      if (ic) b.firstChild.src = ic; else b.firstChild.textContent = (app.n || w.t || '?').trim()[0]?.toUpperCase() || '?';
      b.children[1].textContent = w.d || '∗';
      b.children[1].style.display = (info.ds || []).length > 1 || w.d > 1 ? '' : 'none'; // un solo desktop: niente numero
      b.lastChild.textContent = short(w.t, app.n) || app.n || '';
      b.title = w.t;
      b.addEventListener('click', () => {
        navigator.vibrate?.(10);
        b.animate([{ transform: 'scale(.92)' }, { transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
        send({ w: w.i });
      });
      el.append(b);
    });
    first = false;
  };
  // Il tasto può essere misurato prima di avere la sua misura finale (schermata ancora nascosta): se colonne o righe cambiano si ricostruisce.
  let dims = '';
  const ro = new ResizeObserver(() => {
    if (!el.isConnected) return ro.disconnect();
    if (!st || !dims) return;
    const before = dims;
    fit();
    dims = el.style.getPropertyValue('--wc') + 'x' + el.style.getPropertyValue('--wr');
    if (dims !== before) { const left = el.scrollLeft; build(); el.scrollLeft = left; }
  });
  ro.observe(el);
  return {
    el, upd() {
      const s = [wins?.v, st.d, (info.ds || []).join('|'), iconsVer].join(':');
      if (s === sig) return;
      dims ||= 'x';
      if (wins && sig && sig.split(':')[0] !== String(wins.v)) first = true; // elenco nuovo: rientra animato
      sig = s;
      const left = el.scrollLeft;
      build();
      el.scrollLeft = left;
    }
  };
}

function makeNow(k, i, el) {
  el.classList.add('now');
  el.innerHTML = '<div class="in"><div class="art"><span>♪</span></div><div class="meta"><div class="ti"></div><div class="ar"></div>' +
    '<div class="prog"><div class="trk"><div class="fil"></div></div><div class="times"><span></span><span></span></div></div></div></div>';
  const art = el.querySelector('.art'), ti = el.querySelector('.ti'), ar = el.querySelector('.ar');
  const prog = el.querySelector('.prog'), trk = prog.querySelector('.trk'), fil = prog.querySelector('.fil'), [t0, t1] = prog.querySelectorAll('.times span');
  bindPress(el, k, i);
  // Tocco o trascinamento sulla barra: salta a quel punto del brano (senza play/pausa).
  let seeking = false;
  const seekAt = e => {
    const r = trk.getBoundingClientRect(), x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    info.po = x * info.du * 1000;
    infoAt = performance.now();
    tick();
  };
  prog.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (!st?.cseek || !info.du) return;
    seeking = true;
    prog.setPointerCapture(e.pointerId);
    seekAt(e);
  });
  prog.addEventListener('pointermove', e => { if (seeking) seekAt(e); });
  prog.addEventListener('pointerup', () => { if (!seeking) return; seeking = false; send({ sk: Math.round(info.po / 100) / 10 }); });
  const pos = () => Math.min(info.du || 0, (info.po || 0) / 1000 + (st?.m === 1 && !seeking ? (performance.now() - infoAt) / 1000 : 0));
  const tick = () => {
    if (!info.du || !st?.m) return;
    fil.style.width = (pos() / info.du * 100) + '%';
    t0.textContent = fmt(pos());
    t1.textContent = fmt(info.du);
  };
  let shown = null;
  return {
    el, tick, upd() {
      if (shown !== artUrl) {
        shown = artUrl;
        art.style.backgroundImage = artUrl ? `url(${artUrl})` : '';
        art.classList.toggle('has', !!artUrl);
        art.animate([{ opacity: .3, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
      ti.textContent = st.m ? (info.t || 'Senza titolo') : 'Nessun brano';
      ar.textContent = st.m === 2 ? 'In pausa' : st.m ? (info.ar || '') : (k.l || '');
      prog.style.display = st.m && info.du ? '' : 'none';
      tick();
    }
  };
}

// Avanzamento del brano fluido: calcolato sul telefono tra un aggiornamento e l'altro.
(function frame() {
  for (const v of views) v.tick?.();
  requestAnimationFrame(frame);
})();

// All'apertura: elenco dei PC; in orizzontale ci si ricollega da soli all'ultimo usato (in verticale si resta qui).
(async () => {
  await listPcs();
  // (Solo se il dispositivo è già pronto: il popup di Chrome si può aprire solo dopo un tuo tocco.)
  if (pcs[0]?.dev && !portraitQ.matches) openPc(pcs[0]);
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
